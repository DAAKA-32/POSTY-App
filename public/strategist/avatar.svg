<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- Background disc -->
  <circle cx="32" cy="32" r="32" fill="#fef3c7"/>
  <!-- Subtle border ring (gives the avatar a clean edge at small sizes) -->
  <circle cx="32" cy="32" r="31.5" fill="none" stroke="#fde68a" stroke-width="0.7" opacity="0.8"/>
  <!-- Main 4-point sparkle (vertical/horizontal arms longer than diagonals) -->
  <path d="M 32 13 L 33.5 30.5 L 51 32 L 33.5 33.5 L 32 51 L 30.5 33.5 L 13 32 L 30.5 30.5 Z" fill="#d97706"/>
  <!-- Satellite mini-sparkle, top-right — adds character -->
  <path d="M 47 17 L 47.7 20 L 50.7 20.7 L 47.7 21.4 L 47 24.4 L 46.3 21.4 L 43.3 20.7 L 46.3 20 Z" fill="#f59e0b" opacity="0.85"/>
</svg>
